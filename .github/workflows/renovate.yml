name: Renovate

on:
  schedule:
    # Weekdays at 06:00, 10:00 and 14:00 UTC. Routine PRs still only open on
    # Monday mornings (see "schedule" in default.json); the other runs handle
    # dashboard checkbox requests, security fixes and keeping PRs up to date.
    - cron: "0 6,10,14 * * 1-5"
  workflow_dispatch:
    inputs:
      repo:
        description: "Single repo from repos.json, e.g. digital-land/local-plans-explorer (leave blank for all)"
        required: false
      ignore_schedule:
        description: "Create PRs now instead of waiting for Monday"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: digital-land

      - name: Check out repo list
        uses: actions/checkout@v4
        with:
          sparse-checkout: repos.json
          sparse-checkout-cone-mode: false

      # Renovate runs only on the repos listed in repos.json. A manual run can
      # pick one of them, but not a repo that isn't on the list.
      - name: Read repo list
        id: repos
        env:
          ONLY_REPO: ${{ inputs.repo }}
        run: |
          repos=$(jq -c '[.[].repo]' repos.json)
          if [ -n "$ONLY_REPO" ]; then
            if ! jq -e --arg r "$ONLY_REPO" 'index($r)' <<<"$repos" >/dev/null; then
              echo "::error::$ONLY_REPO is not in repos.json"
              exit 1
            fi
            repos=$(jq -cn --arg r "$ONLY_REPO" '[$r]')
          fi
          echo "Repos: $repos"
          echo "list=$repos" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          # Remove once things are running smoothly.
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ steps.repos.outputs.list }}
          # New repos get an onboarding PR that adds a renovate.json extending our preset.
          RENOVATE_ONBOARDING: "true"
          RENOVATE_ONBOARDING_CONFIG: '{"$schema":"https://docs.renovatebot.com/renovate-schema.json","extends":["local>digital-land/renovate-config"]}'
          # Manual runs can ignore the weekly schedule for this run only.
          RENOVATE_FORCE: ${{ inputs.ignore_schedule && '{"schedule":["at any time"]}' || '{}' }}

      # Put each repo's Dependency Dashboard on the project board, so every
      # repo has one card. Adding an issue that's already on the board does
      # nothing, so it's safe to repeat on every run. Runs even if Renovate
      # reported errors for some repos.
      - name: Refresh App token
        id: board-token
        if: ${{ !cancelled() && vars.UPGRADES_PROJECT_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: digital-land

      - name: Add dashboards to board
        if: ${{ !cancelled() && vars.UPGRADES_PROJECT_ID != '' }}
        uses: actions/github-script@v7
        env:
          PROJECT_ID: ${{ vars.UPGRADES_PROJECT_ID }}
          BOT_LOGIN: ${{ steps.board-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.board-token.outputs.token }}
          script: |
            const fs = require('fs');
            const botLogin = process.env.BOT_LOGIN;
            const projectId = process.env.PROJECT_ID;

            const repos = JSON.parse(fs.readFileSync('repos.json', 'utf8'));

            for (const { repo: fullName } of repos) {
              const [owner, repo] = fullName.split('/');
              try {
                // Filter on the author here rather than with the API's
                // "creator" parameter, which doesn't reliably match bots.
                const issues = await github.paginate(github.rest.issues.listForRepo,
                  { owner, repo, state: 'open', labels: 'dependencies', per_page: 100 });

                for (const i of issues) {
                  if (i.pull_request || i.user?.login !== botLogin) continue;
                  if (i.title !== 'Dependency Dashboard') continue;
                  await github.graphql(
                    `mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}`,
                    { p: projectId, c: i.node_id });
                  core.info(`${fullName}: dashboard #${i.number} on board`);
                }
              } catch (err) {
                core.warning(`${fullName}: could not add dashboard to board: ${err.message}`);
              }
            }